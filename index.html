<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe — 4x4 & 3x3 Matrix with Smart AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="confetti-canvas"></canvas>

    <div class="app-wrapper">
        <header class="game-header">
            <div class="logo-badge">Dynamic Grid Strategy</div>
            <h1>Tic-Tac-Toe</h1>
            <p id="turn-indicator" class="turn-indicator">Turn: <span class="player-tag player-o">Player O</span></p>
        </header>

        <!-- Grid Size Mode Selector -->
        <div class="grid-mode-bar">
            <button class="grid-size-btn active" data-size="4">4 × 4 Matrix (4 in a row)</button>
            <button class="grid-size-btn" data-size="3">3 × 3 Classic</button>
        </div>

        <!-- Scoreboard -->
        <section class="scoreboard-card" aria-label="Scoreboard">
            <div class="score-item player-o-box">
                <span class="score-label" id="label-player-o">Player O</span>
                <span class="score-value" id="score-o">0</span>
            </div>
            <div class="score-item draws-box">
                <span class="score-label">Draws</span>
                <span class="score-value" id="score-draw">0</span>
            </div>
            <div class="score-item player-x-box">
                <span class="score-label" id="label-player-x">Computer (X)</span>
                <span class="score-value" id="score-x">0</span>
            </div>
        </section>

        <!-- Controls Bar -->
        <div class="controls-bar">
            <div class="mode-select-wrap">
                <label for="ai-mode-select">Opponent:</label>
                <select id="ai-mode-select">
                    <option value="smart" selected>Smart AI</option>
                    <option value="easy">Casual AI</option>
                    <option value="pvp">2 Players (Local)</option>
                </select>
            </div>
            <div class="btn-group">
                <button id="sound-btn" class="icon-btn" title="Toggle Sound" aria-label="Toggle Sound">🔊</button>
                <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Game Settings">⚙️</button>
            </div>
        </div>

        <!-- Dynamic Game Grid (rendered via JS) -->
        <main class="grid-container">
            <div class="game-board grid-4x4" id="game-board" role="grid" aria-label="Tic-Tac-Toe Board">
                <!-- Tiles dynamically generated based on 4x4 or 3x3 -->
            </div>
        </main>

        <!-- Actions -->
        <div class="actions-bar">
            <button id="resetbtn" class="btn btn-secondary">New Round</button>
            <button id="reset-match-btn" class="btn btn-outline">Reset Match</button>
        </div>
    </div>

    <!-- Round Winner Banner Modal -->
    <div id="round-modal" class="modal-overlay hide">
        <div class="modal-card win-banner">
            <div id="round-icon" class="banner-icon">🏆</div>
            <h2 id="msg">Congratulations!</h2>
            <p id="sub-msg" class="sub-msg">Player O wins the round!</p>
            <div class="modal-actions">
                <button id="new-btn" class="btn btn-primary">Next Round</button>
            </div>
        </div>
    </div>

    <!-- Match Winner Celebration Modal -->
    <div id="match-modal" class="modal-overlay hide">
        <div class="modal-card match-card">
            <div class="trophy-glow">🎉 👑 🎉</div>
            <h2 id="match-winner-title">Match Champion!</h2>
            <p id="match-winner-score" class="match-score-text">Player O won the match 3 - 1</p>
            <div class="modal-actions">
                <button id="match-continue-btn" class="btn btn-primary">Start New Match</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hide">
        <div class="modal-card">
            <h2>Game Settings</h2>

            <div class="input-group">
                <label for="player-o-name">Player O (Blue) Name</label>
                <input type="text" id="player-o-name" placeholder="Player O" maxlength="15">
            </div>

            <div class="input-group">
                <label for="player-x-name">Player X (Pink) Name</label>
                <input type="text" id="player-x-name" placeholder="Player X" maxlength="15">
            </div>

            <div class="input-group">
                <label for="best-of-select">Match Series Length</label>
                <select id="best-of-select">
                    <option value="1">Single Round</option>
                    <option value="3">Best of 3</option>
                    <option value="5" selected>Best of 5</option>
                    <option value="7">Best of 7</option>
                </select>
            </div>

            <div class="modal-actions">
                <button id="settings-save-btn" class="btn btn-primary">Save & Apply</button>
                <button id="settings-close-btn" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="first.js"></script>
</body>
</html>
